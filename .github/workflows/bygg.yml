name: Bygg spelet

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            namn: windows
          - os: macos-latest
            namn: macos-apple
          - os: macos-15-intel
            namn: macos-intel
          - os: ubuntu-22.04
            namn: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera
        run: pip install -r requirements.txt pyinstaller==6.22.3

      # panda3d:s macOS-hjul har några bibliotek som bara finns för Intel
      # (Cg och libRocket, som spelet inte använder). PyInstaller vägrar ta med
      # dem i en arm64-build, så vi tar bort dem innan bygget.
      - name: Ta bort Intel-bibliotek (Apple Silicon)
        if: matrix.namn == 'macos-apple'
        run: |
          cd "$(python -c 'import panda3d, os; print(os.path.dirname(panda3d.__file__))')"
          for f in *.dylib *.so; do
            if ! lipo -archs "$f" | grep -qw arm64; then
              echo "Tar bort $f ($(lipo -archs "$f"))"
              rm "$f"
            fi
          done

      - name: Bygg
        run: python bygg.py

      - name: Packa (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Manhjalten -DestinationPath Manhjalten-${{ matrix.namn }}.zip

      - name: Packa (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Manhjalten.app Manhjalten-${{ matrix.namn }}.zip

      - name: Packa (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Manhjalten-${{ matrix.namn }}.tar.gz -C dist Manhjalten

      - uses: actions/upload-artifact@v4
        with:
          name: Manhjalten-${{ matrix.namn }}
          path: Manhjalten-${{ matrix.namn }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: Manhjalten-*
